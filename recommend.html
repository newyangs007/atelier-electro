<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>동료에게 추천하기 · 가전레이더 GAJEON RADAR</title>
<meta name="description" content="가전 업계 소식을 매일 아침 3분으로 정리해 주는 가전레이더를 동료에게 추천하세요. 카카오톡·메일·문자로 바로 보낼 수 있어요.">
<link rel="canonical" href="https://newyangs007.github.io/atelier-electro/recommend.html">
<link rel="icon" href="favicon.svg">
<meta property="og:title" content="가전레이더 GAJEON RADAR — 매일 아침 7시 가전 뉴스레터">
<meta property="og:description" content="가전뉴스·숫자로 보는 오늘·신제품·MD 픽을 출처와 함께 3분 분량으로. 무료 구독.">
<meta property="og:url" content="https://newyangs007.github.io/atelier-electro/">
<meta property="og:image" content="https://newyangs007.github.io/atelier-electro/og.png">
<style>
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#111;background:#fafafa;word-break:keep-all;line-height:1.6}
.top{background:#000;color:#fff}.w{max-width:560px;margin:0 auto;padding:0 18px}
.top .w{display:flex;align-items:center;height:52px}.top a{color:#fff;text-decoration:none;font-weight:900;font-size:20px}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:18px;padding:24px 20px;margin:22px 0;box-shadow:0 18px 40px -30px rgba(0,0,0,.4)}
.eb{font-size:11px;font-weight:800;letter-spacing:.3em;color:#e0301e}
h1{font-size:24px;line-height:1.35;margin:6px 0 8px}
.lead{color:#444;font-size:15px;margin:0 0 18px}
.msg{background:#f4f4f2;border-radius:12px;padding:12px 14px;font-size:14px;color:#333;margin-bottom:16px;white-space:pre-line}
.btns{display:grid;gap:10px}
.btns a,.btns button{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800;text-decoration:none;cursor:pointer;transition:transform .15s,filter .2s}
.btns a:active,.btns button:active{transform:scale(.98)}
.kk{background:#fee500;color:#191919}.gm{background:#111;color:#fff}.sm{background:#fff;color:#111;border:1.5px solid #111!important}.cp{background:#f1f1ef;color:#111}
.go{display:block;text-align:center;margin:18px 0 0;color:#e0301e;font-weight:800;text-decoration:none}
.st{font-size:13px;color:#2a7a2a;text-align:center;min-height:1.2em;margin-top:8px}
footer{color:#777;font-size:12px;padding:10px 0 30px}
</style>
</head>
<body>
<header class="top"><div class="w"><a href="./">가전레이더</a></div></header>
<main class="w">
  <div class="card">
    <div class="eb">RECOMMEND</div>
    <h1>가전 일 하는 동료에게<br>가전레이더를 추천해 주세요</h1>
    <p class="lead">매일 아침 7시, 가전뉴스·숫자로 보는 오늘·신제품·MD 픽을 출처와 함께 3분 분량으로 보내 드려요. 구독은 무료입니다.</p>
    <div class="msg" id="msg"></div>
    <div class="btns">
      <button type="button" class="kk" id="kk">카카오톡으로 보내기</button>
      <a class="gm" id="gm" target="_blank" rel="noopener">Gmail로 보내기</a>
      <a class="sm" id="sm">문자로 보내기</a>
      <button type="button" class="cp" id="cp">링크 복사하기</button>
    </div>
    <p class="st" id="st" role="status" aria-live="polite"></p>
    <a class="go" href="./#subscribe">가전레이더 보러 가기 · 무료 구독 →</a>
  </div>
</main>
<footer class="w">가전레이더 GAJEON RADAR · 매일 아침 7시 발행</footer>
<script>
(function(){
  var base=location.origin+location.pathname.replace(/[^/]*$/,'');
  var url=base+'#subscribe';
  var text='가전 업계 소식을 매일 아침 3분으로 정리해 주는 가전레이더예요. 가전뉴스·신제품·MD 픽을 출처와 함께 보내 줘요. 무료 구독해 보세요.';
  var full=text+'\n'+url;
  document.getElementById('msg').textContent=full;
  var st=document.getElementById('st');
  function copy(){if(navigator.clipboard){navigator.clipboard.writeText(full).then(function(){st.textContent='복사됐어요. 카카오톡·메신저 대화창에 붙여 넣으세요.';},function(){prompt('아래 내용을 복사하세요',full);});}else{prompt('아래 내용을 복사하세요',full);}}
  document.getElementById('kk').onclick=function(){if(navigator.share){navigator.share({title:'가전레이더 GAJEON RADAR',text:text,url:url}).catch(function(){});}else{copy();}};
  document.getElementById('cp').onclick=copy;
  document.getElementById('gm').href='https://mail.google.com/mail/?view=cm&fs=1&su='+encodeURIComponent('[추천] 매일 아침 가전 뉴스레터 가전레이더')+'&body='+encodeURIComponent(full);
  var ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  document.getElementById('sm').href='sms:'+(ios?'&':'?')+'body='+encodeURIComponent(full);
})();
</script>
</body>
</html>
